name: Deploy Worker

# Publica de verdade (wrangler deploy) somente a partir da main.
# Nenhum outro branch/PR aciona este workflow — implantação real nunca
# corre em código ainda não mesclado.
on:
  push:
    branches:
      - main

permissions:
  contents: read

# Evita duas implantações reais concorrentes; um push novo cancela a
# implantação em andamento do commit anterior.
concurrency:
  group: deploy-worker-main
  cancel-in-progress: true

jobs:
  deploy:
    name: wrangler deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
