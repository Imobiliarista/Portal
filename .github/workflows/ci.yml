name: CI

# Lote 19 (project.md, seção 10) — primeiro workflow de verificação de
# código do repositório (o outro workflow existente, guarda-pr-empilhada.yml
# da PR #60, cuida só do processo de merge, não do conteúdo do código).
# Roda em todo PR contra main.

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Typecheck — bloqueante de verdade. A dívida técnica pré-existente de
      # 51 erros de tsc (baseline tolerada desde a PR #61) foi zerada no
      # Lote 22 (project.md, seção 11): qualquer erro novo agora quebra o
      # CI, sem baseline pra folgar.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Smoke test de integração (Lote 19 — funil completo do corretor)
        run: npm run test

      - name: Build do CSS + dry-run do bundle do Worker
        run: |
          npm run build:css
          npx wrangler deploy --dry-run

      # Guardrail — incidente de segurança R2 (2026-08-19, ver project.md,
      # Histórico de Decisões): falha o PR se o bucket privado do backup
      # mensal do D1 (BACKUP_PRIVADO/imob-backup-privado, sensível —
      # senha_hash/CPF/tokens de sessão) tiver Custom Domain ou r2.dev
      # habilitado na conta Cloudflare real. Só roda se os Secrets
      # CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID estiverem configurados
      # no repositório (ver scripts/ci/verificar-bucket-backup-privado.js
      # para o passo manual de configurá-los) — sem eles, este passo é
      # pulado, nunca finge que passou.
      - name: Verificar bucket de backup privado (Cloudflare R2)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ci/verificar-bucket-backup-privado.js
