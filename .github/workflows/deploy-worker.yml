name: Deploy do Worker (manual)

# Publica o Worker "portal" (código + assets estáticos) via
# wrangler deploy. Disparo exclusivamente manual (workflow_dispatch) — não
# roda em push, de propósito, para nunca publicar um commit sem alguém
# decidir isso explicitamente. Reaproveita as mesmas credenciais já
# configuradas no Environment `production-r2` (CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID) usadas por publish-r2-read-models.yml — sem
# credencial nova.
#
# Este workflow NUNCA toca R2 (não publica read models, não escreve
# nem apaga objetos) — só implanta o Worker via wrangler deploy.
#
# Node 22 (não 20): wrangler ^4.125.0 (ver package-lock.json) exige
# node >=22 — usar Node 20 aqui reproduz o warning EBADENGINE já visto
# numa run antiga do deploy.yml removido no PR #32.

on:
  workflow_dispatch:
    inputs:
      branch_check:
        description: "Confirmação: este deploy só roda a partir de main (checado automaticamente, este campo é só informativo)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: imob-deploy-worker-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy do Worker portal
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production-r2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instala dependências
        run: npm ci

      - name: Confere credenciais sem revelar valores
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN ausente — abortando." >&2
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID ausente — abortando." >&2
            exit 1
          fi
          echo "Credenciais presentes (valores nunca exibidos neste log)."

      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Resumo
        if: always()
        run: |
          {
            echo "## Deploy do Worker portal"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Environment: production-r2"
            echo "- R2: não tocado por este workflow"
          } >> "$GITHUB_STEP_SUMMARY"
