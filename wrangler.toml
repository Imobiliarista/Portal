#:schema node_modules/wrangler/config-schema.json
name = "imobiliarista-net"
main = "worker/index.js"
compatibility_date = "2026-08-23"

# Workers Static Assets (§3.2) — one shell for the whole zone (apex +
# wildcard). frontend/dispatch.js picks the SPA module client-side: portal
# vs minisite by hostname (wildcard *.imobiliarista.net, reserved for
# corretor minisites and, in the future, onepages), painel/admin by path
# under the apex domain (imobiliarista.net/painel, imobiliarista.net/admin
# — not subdomains). Deliberately no `run_worker_first = ["/*"]` (§3.2
# explicitly says to avoid it): public navigation is served straight off
# Static Assets/R2 and never touches the Worker (§73, §89). Only /api/*
# invokes the Worker script.
[assets]
directory = "frontend"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# R2 bindings (§23–§25). Bucket names below are the 3 buckets this
# architecture calls for — PENDING manual creation in the Cloudflare
# dashboard before `wrangler versions upload`/`deploy` can bind them.
# See docs/OPERATIONS.md for the full pendency list.
[[r2_buckets]]
binding = "IMOB_PRIVATE"
bucket_name = "imob-private"

[[r2_buckets]]
binding = "IMOB_DATA"
bucket_name = "imob-data"

[[r2_buckets]]
binding = "IMOB_MEDIA"
bucket_name = "imob-media"

# Secrets (SESSION_SECRET for core/session.js, Etapa 4; PASSWORD_PEPPER for
# core/auth.js's HMAC-over-PBKDF2-result step; LOGIN_INDEX_SECRET for
# storage/indexes.js's keyed lookup-index hash — §27 hotfix pt.1/pt.3, two
# deliberately separate secrets, different jobs) are provisioned via
# `wrangler secret put <NAME>` and must never be committed here (§3.1, §27).
# PASSWORD_PEPPER and LOGIN_INDEX_SECRET are both PENDING manual
# provisioning before this hotfix can go live — see docs/OPERATIONS.md.
#
# Etapa 9 (§43, módulo saved-search) adds two more, both PENDING:
#   RESEND_API_KEY — modules/saved-search/notifications.js, Resend API
#     (domínio imobiliarista.net já verificado na conta Resend).
#   SAVED_SEARCH_TOKEN_SECRET — modules/saved-search/service.js, assina os
#     tokens de confirmação/cancelamento (reaproveita core/session.js's
#     HMAC-claims primitive, secret PRÓPRIO, nunca SESSION_SECRET).
# See docs/OPERATIONS.md.
#
# Etapa 10 (§51, módulo financial, integração Asaas sandbox) adds two more,
# both PENDING (no sandbox credential of any kind exists for this project
# yet — see docs/OPERATIONS.md):
#   ASAAS_API_KEY — modules/financial/provider.js, header `access_token`
#     em toda chamada à API do Asaas.
#   ASAAS_WEBHOOK_TOKEN — modules/financial/webhook.js, valida o header
#     `asaas-access-token` que o Asaas ecoa em cada notificação de webhook
#     (secret PRÓPRIO, nunca ASAAS_API_KEY — mesmo raciocínio de secrets
#     separados por job de PASSWORD_PEPPER/LOGIN_INDEX_SECRET).
# Nenhuma delas é lida por nada enquanto FINANCIAL_ENABLED (abaixo) não for
# "true" — provisioná-las sozinhas não liga o módulo.

# Etapa 10 (§51, módulo financial) — kill switch global do módulo, o
# primeiro uso real deste bloco `[vars]` (reservado desde a Etapa 9, nunca
# usado até agora). "false" é o default deliberado (§51 pede o módulo
# "DESATIVADO por flag" neste lote): com este valor, nenhuma função de
# modules/financial/ chega a montar uma Request para o Asaas (ver
# modules/financial/provider.js). Trocar para "true" ativa o módulo sem
# precisar redeployar código — editando este valor no dashboard Cloudflare
# ("Settings > Variables and Secrets") em vez de rodar `wrangler deploy` —,
# mas um `wrangler deploy` de rotina depois disso reaplica o "false"
# commitado aqui (fail-safe intencional; ver
# modules/financial/README.md#decisões para a ressalva completa).
[vars]
FINANCIAL_ENABLED = "false"
