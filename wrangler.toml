name = "portal-imobiliarista"
type = "javascript"
account_id = ""
workers_dev = true
compatibility_date = "2024-12-11"

[build]
command = "npm run build"
cwd = "./"
main = "dist/index.js"

[[d1_databases]]
binding = "DB"
database_name = "imobiliarista-db"
database_id = ""

[[r2_buckets]]
binding = "JSON_CACHE"
bucket_name = "imobiliarista-jsons"

[[queues.consumers]]
queue = "fila-geracao-lote"
max_batch_size = 10
max_batch_timeout = 10
max_retries = 5
dead_letter_queue = "fila-geracao-lote-dlq"

[[routes]]
pattern = "imobiliarista.net/*"
zone_name = "imobiliarista.net"

[[routes]]
pattern = "*.imobiliarista.net/*"
zone_name = "imobiliarista.net"
