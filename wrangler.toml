#:schema node_modules/wrangler/config-schema.json
name = "imobiliarista-net"
main = "worker/index.js"
compatibility_date = "2026-08-23"

# Workers Static Assets (§3.2) — portal shell today, SPA per hostname
# (portal / minisite / painel / admin) from Etapa 2 onward. Deliberately no
# `run_worker_first = ["/*"]` (§3.2 explicitly says to avoid it): public
# navigation is served straight off Static Assets/R2 and never touches the
# Worker (§73, §89). Only /api/* invokes the Worker script.
[assets]
directory = "frontend"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# R2 bindings (§23–§25). Bucket names below are the 3 buckets this
# architecture calls for — PENDING manual creation in the Cloudflare
# dashboard before `wrangler versions upload`/`deploy` can bind them.
# See docs/OPERATIONS.md for the full pendency list.
[[r2_buckets]]
binding = "IMOB_PRIVATE"
bucket_name = "imob-private"

[[r2_buckets]]
binding = "IMOB_DATA"
bucket_name = "imob-data"

[[r2_buckets]]
binding = "IMOB_MEDIA"
bucket_name = "imob-media"

# Secrets (SESSION_SECRET for core/session.js, Etapa 4; PASSWORD_PEPPER for
# core/auth.js's HMAC-over-PBKDF2-result step; LOGIN_INDEX_SECRET for
# storage/indexes.js's keyed lookup-index hash — §27 hotfix pt.1/pt.3, two
# deliberately separate secrets, different jobs) are provisioned via
# `wrangler secret put <NAME>` and must never be committed here (§3.1, §27).
# PASSWORD_PEPPER and LOGIN_INDEX_SECRET are both PENDING manual
# provisioning before this hotfix can go live — see docs/OPERATIONS.md.
# Non-secret plain vars, when needed, belong in a `[vars]` block — none are
# required yet.
