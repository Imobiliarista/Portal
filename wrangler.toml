name = "imobiliarista-portal"
main = "src/index.ts"
compatibility_date = "2026-08-05"
compatibility_flags = ["nodejs_compat"]

# Workers Cache multi-tenant (v11.4) — substitui o cache manual via Cache
# API (`caches.default`, PR #41). Cache desligado no nível raiz e no
# export default (o Gateway precisa rodar em toda requisição pra extrair
# o tenant do hostname e popular ctx.props antes de qualquer decisão de
# cache).
#
# MITIGAÇÃO (regressão pós-PR #50, 2026-08-17): StatusBackend/SiteBackend
# temporariamente com cache DESLIGADO. Corretores aprovados/online no D1
# (ex.: aranda, teste) estavam retornando "Indisponível" publicamente logo
# após o merge do PR #50 — suspeito principal é este mecanismo de cache em
# exports (`ctx.exports.X(...).fetch(req, {cf:{cacheKey}})`), que não foi
# possível validar contra o edge real antes do merge (a suposta validação
# em `wrangler dev` citada no PR original não reproduz o comportamento
# real deste recurso — testes locais posteriores mostraram respostas
# inconsistentes com o cacheKey/dado em R2). Desligar aqui não muda a
# lógica de leitura: StatusBackend/SiteBackend continuam lendo o R2
# diretamente a cada requisição, só sem a camada de cache extra por cima.
# Reabilitar só depois de confirmar em produção (headers CF-Cache-Status
# reais, não emulação local) que o mecanismo isola por tenant como
# esperado. Ver PROJETO_EXECUTIVO_ARQUITETURA_IMOBILIARISTA_v11_4, seções
# 33-47, e src/status-backend.ts / src/site-backend.ts / src/index.ts.
[cache]
enabled = false

[exports.default]
type = "worker"
  [exports.default.cache]
  enabled = false

[exports.StatusBackend]
type = "worker"
  [exports.StatusBackend.cache]
  enabled = false

[exports.SiteBackend]
type = "worker"
  [exports.SiteBackend.cache]
  enabled = false

# Static Assets — shell da SPA (público e painel), modo SPA fallback.
# Ver project.md, seção 4.6.
#
# Plano C, Parte 2: `run_worker_first` restrito por rota em vez do booleano
# `true` anterior. O Worker ainda precisa rodar em toda requisição dinâmica
# — cache de borda (src/index.ts, Parte 1), bot-detect/dynamic rendering de
# anúncio, roteamento de API/painel, leitura de status em R2 — mas arquivo
# estático puro (CSS/JS/ícones) nunca deve invocar o Worker, e passa a ser
# servido direto pela edge. `!` exclui explicitamente; ordem importa
# (última regra que casa vence, mesma semântica de `_routes.json`).
# Prefixos estáticos confirmados em `public/` (sem contar `index.html`, que
# é o shell da SPA e precisa passar pelo Worker): `/assets/*` (CSS/JS) e
# `/icons/*` (ícones do PWA/favicon). Se novos prefixos 100% estáticos
# forem adicionados a `public/`, adicionar aqui também.
[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/*", "!/assets/*", "!/icons/*"]

# D1 — fonte da verdade (escrita + leitura administrativa, nunca lido
# diretamente pelo visitante público). Ver project.md, seção 4.3.
[[d1_databases]]
binding = "DB"
database_name = "imob-bd"
database_id = "46c7f8d4-ef47-47f4-8c62-ebe63516f6a6"

# R2 — JSONs por cidade/corretor (dados) e imagens dos anúncios (mídias),
# em buckets separados, servidos via domínio público próprio (bypass do
# Worker nas leituras). Ver seção 4.3.
[[r2_buckets]]
binding = "DADOS_CACHE"
bucket_name = "imob-dados"

[[r2_buckets]]
binding = "MIDIAS"
bucket_name = "imob-midias"

# AI (Cloudflare Workers AI) — assistente de busca em linguagem natural
# Free tier: 10.000 Neurons/dia, sem cartão de crédito. Ver seção 4.12.
[ai]
binding = "AI"

# Queue — fila de alterações em lote do painel. Uma mensagem por arquivo
# a ser gerado (JSON cidade, JSON corretor, XML por portal externo),
# nunca uma mensagem única por corretor. Ver seções 4.4 e 4.4.1.1.
[[queues.producers]]
binding = "FILA_ALTERACOES"
queue = "imob-queue"

[[queues.consumers]]
queue = "imob-queue"
max_batch_size = 10
max_batch_timeout = 30
# Limita retentativas por mensagem — sem isso, uma mensagem que nunca
# consegue processar (payload inconsistente, bug no handler) fica
# retentando pra sempre, consumindo cota sem necessidade (seção 4.9/4.10).
# Esgotado o limite, a mensagem vai pra `dead_letter_queue` em vez de
# sumir ou loopar. A fila "imob-queue-dlq" precisa existir antes do
# deploy: `wrangler queues create imob-queue-dlq`.
max_retries = 5
dead_letter_queue = "imob-queue-dlq"

# Rotas — DECISÃO FECHADA (seção 4.3): duas rotas, não uma. O wildcard
# não cobre o domínio raiz puro.
[[routes]]
pattern = "imobiliarista.net/*"
zone_name = "imobiliarista.net"

[[routes]]
pattern = "*.imobiliarista.net/*"
zone_name = "imobiliarista.net"

# Cron Trigger — export mensal do D1 para R2 (Lote 13)
# Executa todo dia 1º de cada mês às 00:00 UTC
[triggers]
crons = ["0 0 1 * *"]

# Variáveis públicas (não sensíveis — para segredos, usar `wrangler secret put`)
# Feed Padrão da Rede — módulo Publicações (Lote 16, seção 4.19). Substituir
# pela URL real do blog institucional do Blogspot quando ele for criado.
[vars]
FEED_PADRAO_REDE_URL = "https://exemplo-substituir.blogspot.com/feeds/posts/default"
