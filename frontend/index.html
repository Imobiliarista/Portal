<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>imobiliarista.net</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      // Etapa 2 (§90, §74) — uma única Static Assets deployment atende o
      // domínio raiz e o wildcard *.imobiliarista.net (mesma zona/rota,
      // §1). Não existe roteamento por hostname no servidor (§73 mantém o
      // Worker fora da navegação pública) — a decisão "portal vs minisite"
      // é só do Browser, lendo location.hostname, exatamente como §74
      // descreve para o slug do corretor.
      const APEX = "imobiliarista.net";
      const RESERVED_HOSTS = new Set([
        APEX,
        `www.${APEX}`,
        `painel.${APEX}`,
        `admin.${APEX}`,
        `dados.${APEX}`,
        `media.${APEX}`,
        "localhost",
        "127.0.0.1",
      ]);

      const host = location.hostname;
      const isPainelHost = host === `painel.${APEX}`;
      const isAdminHost = host === `admin.${APEX}`;
      // Local dev has no real painel./admin.imobiliarista.net hostname to
      // hit — `?app=painel`/`?app=admin` is the same kind of escape hatch
      // as frontend/portal/data.js's `window.__IMOB_DATA_BASE_URL__` override.
      const devOverrideApp =
        (host === "localhost" || host === "127.0.0.1") ? new URLSearchParams(location.search).get("app") : null;
      const isMinisite = host.endsWith(`.${APEX}`) && !RESERVED_HOSTS.has(host);
      // Absolute path — this same index.html is served (SPA fallback) for
      // every route (e.g. /imovel/{slug}, /{citySlug}, /imoveis/{id}), so a
      // path relative to the current URL would resolve wrong on any route
      // but "/".
      const modulePath =
        isAdminHost || devOverrideApp === "admin"
          ? "/admin/app.js"
          : isPainelHost || devOverrideApp === "painel"
            ? "/painel/app.js"
            : isMinisite
              ? "/minisite/app.js"
              : "/portal/app.js";

      const { mount } = await import(modulePath);
      mount(document.getElementById("app"));

      // Módulo pwa (§48) — registro/link opcional, só no host do portal
      // (o manifest é branding do portal, não de corretor/minisite —
      // ver modules/pwa/README.md). Isolado de propósito: nenhuma lógica
      // do módulo mora aqui, só esta chamada; se frontend/manifest.json e
      // frontend/service-worker.js não existirem (módulo removido), o
      // <link> é ignorado pelo browser e `register` rejeita — capturado
      // abaixo — sem afetar o resto do portal.
      const isPortalHost = !isMinisite && !isPainelHost && !isAdminHost;
      if (isPortalHost && "serviceWorker" in navigator) {
        const manifestLink = document.createElement("link");
        manifestLink.rel = "manifest";
        manifestLink.href = "/manifest.json";
        document.head.append(manifestLink);
        navigator.serviceWorker.register("/service-worker.js").catch(() => {});
      }
    </script>
  </body>
</html>
